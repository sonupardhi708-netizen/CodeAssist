name: Nexus Production Compiler Engine

on:
  repository_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Stable Project
        run: |
          rm -rf nexus_app
          flutter create nexus_app --project-name=nexus_mod_app
          cd nexus_app
          cat << 'EOF' > lib/main.dart
          ${{ github.event.client_payload.code }}
          EOF

      - name: Build Production APK
        run: |
          cd nexus_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Old Releases
        run: |
          gh release delete latest --yes || true
          git push --delete origin latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Direct App Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: nexus_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
